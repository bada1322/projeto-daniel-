<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculadora de Redes</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f2f2f7;--text:#000;--num:#ffffff;--numt:#000;--fn:#d1d1d6;--fnt:#000;--card:#ffffff;--alt:#f2f2f7;
  --op:#ff9500;--opt:#fff;--opabg:#ffe0b0;--sub:#6e6e73;--line:#d9d9de;--err:#d70015;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000;--text:#fff;--num:#333336;--numt:#fff;--fn:#a5a5a5;--fnt:#000;--card:#1c1c1e;--alt:#2c2c2e;
    --op:#ff9f0a;--opt:#fff;--opabg:#fff;--sub:#8e8e93;--line:#38383a;--err:#ff6961;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000;--text:#fff;--num:#333336;--numt:#fff;--fn:#a5a5a5;--fnt:#000;--card:#1c1c1e;--alt:#2c2c2e;
  --op:#ff9f0a;--opt:#fff;--opabg:#fff;--sub:#8e8e93;--line:#38383a;--err:#ff6961;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--op);outline-offset:2px}
.wrap{max-width:960px;margin:0 auto;padding:14px 16px 32px;display:grid;gap:22px}
.calc{position:relative;max-width:400px;width:100%;margin:0 auto;overflow:hidden}
@media (min-width:900px){.wrap{grid-template-columns:400px 1fr;align-items:start}.calc{margin:0}}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.seg{display:flex;padding:2px;border-radius:9px;background:var(--card)}
.seg button{background:transparent;font-size:13px;padding:5px 11px;border-radius:7px;color:var(--sub)}
.seg button[aria-pressed="true"]{background:var(--fn);color:var(--fnt);font-weight:600}
.chip{background:var(--card);color:var(--op);font-size:13px;font-weight:600;padding:7px 14px;border-radius:999px}
.screen{display:flex;flex-direction:column;gap:6px;margin:14px 0 8px}
.field{display:block;width:100%;text-align:right;background:transparent;border-radius:14px;padding:8px 10px;border:2px solid transparent}
.field.on{border-color:var(--op)}
.field small{display:block;font-size:12px;color:var(--sub)}
.field .v{display:block;font-weight:300;letter-spacing:-.5px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
#net .v{font-size:44px;line-height:1.15}
#val .v{font-size:36px;line-height:1.15}
.v.ph{color:var(--sub)}
.err{min-height:18px;margin:0 10px 8px;text-align:right;font-size:13px;color:var(--err)}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.pad button{aspect-ratio:1;border-radius:50%;font-size:30px;transition:filter .08s}
.pad button:active{filter:brightness(1.35)}
.k{background:var(--num);color:var(--numt)}
.f{background:var(--fn);color:var(--fnt);font-size:24px!important}
.o{background:var(--op);color:var(--opt);font-size:34px!important}
.o.on{background:var(--opabg);color:var(--op)}
.pad .zero{grid-column:span 3;aspect-ratio:auto;border-radius:999px;text-align:left;padding-left:30px}
.sheet{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .25s ease;z-index:5;padding:4px 0}
.sheet.open{transform:none}
.sh-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sh-top h2{margin:0;font-size:20px}
.sh-top button{background:transparent;color:var(--op);font-size:16px;padding:6px 4px}
#list{flex:1;overflow:auto;margin:0;padding:0;list-style:none;background:var(--card);border-radius:12px}
#list li{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
#list li:last-child{border-bottom:0}
#list b{display:block;font-weight:500;font-size:17px;font-variant-numeric:tabular-nums}
#list small{color:var(--sub);font-size:13px}
.empty{color:var(--sub);text-align:center;cursor:default!important}
.res{display:flex;flex-direction:column;gap:18px;min-width:0}
.group{background:var(--card);border-radius:12px;overflow:hidden}
.group h2{margin:0;padding:10px 14px 4px;font-size:13px;font-weight:600;color:var(--sub)}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row span{color:var(--sub)}
.row b{font-weight:500;text-align:right;font-variant-numeric:tabular-nums;word-break:break-all}
.bin{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12px}
.bin i{font-style:normal;color:var(--op);font-weight:700}
.bin u{text-decoration:none;color:var(--sub)}
.tools{display:flex;align-items:center;justify-content:space-between}
.tools h2{margin:0;font-size:20px}
.sn{padding:11px 14px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.sn:last-child{border-bottom:0}
.sn b{display:block;font-size:16px}
.sn div{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--sub);margin-top:2px}
.sn div em{font-style:normal;color:var(--text);text-align:right}
.sn div em.bc{color:var(--op);font-weight:600}
.note{font-size:13px;color:var(--sub);margin:0 4px}
@media (prefers-reduced-motion:reduce){.sheet,.pad button{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="calc" id="calc">
    <div class="top">
      <div class="seg" role="group" aria-label="Dividir por">
        <button type="button" data-m="subnets" aria-pressed="true">Sub-redes</button>
        <button type="button" data-m="hosts" aria-pressed="false">Hosts</button>
        <button type="button" data-m="prefix" aria-pressed="false">Prefixo</button>
      </div>
      <button class="chip" id="hbtn" type="button">Histórico</button>
    </div>
    <div class="screen">
      <button class="field on" id="net" type="button"><small>Rede base</small><span class="v" id="netv"></span></button>
      <button class="field" id="val" type="button"><small id="vlab">Quantidade de sub-redes</small><span class="v" id="valv"></span></button>
    </div>
    <p class="err" id="err" role="alert" aria-live="polite"></p>
    <div class="pad" id="pad">
      <button class="f" type="button" data-k="ac">AC</button>
      <button class="f" type="button" data-k="bs" aria-label="Apagar">⌫</button>
      <button class="f" type="button" data-k="t:255">255</button>
      <button class="o" type="button" data-k="sw" aria-label="Alternar campo">⇅</button>
      <button class="k" type="button" data-k="t:7">7</button>
      <button class="k" type="button" data-k="t:8">8</button>
      <button class="k" type="button" data-k="t:9">9</button>
      <button class="o" type="button" data-k="t:/">/</button>
      <button class="k" type="button" data-k="t:4">4</button>
      <button class="k" type="button" data-k="t:5">5</button>
      <button class="k" type="button" data-k="t:6">6</button>
      <button class="o" type="button" data-k="t:.">.</button>
      <button class="k" type="button" data-k="t:1">1</button>
      <button class="k" type="button" data-k="t:2">2</button>
      <button class="k" type="button" data-k="t:3">3</button>
      <button class="o" type="button" data-k="t: " aria-label="Espaço">␣</button>
      <button class="k zero" type="button" data-k="t:0">0</button>
      <button class="o" type="button" data-k="eq">=</button>
    </div>
    <section class="sheet" id="sheet" aria-label="Histórico">
      <div class="sh-top"><button type="button" id="hclear">Limpar</button><h2>Histórico</h2><button type="button" id="hclose">Fechar</button></div>
      <ul id="list"></ul>
    </section>
  </div>
  <div class="res">
    <div class="group"><h2>Rede original</h2><div id="orig"></div></div>
    <div class="group"><h2>Cada sub-rede</h2><div id="sub"></div></div>
    <div class="tools"><h2 id="tt">Sub-redes</h2><button class="chip" id="copy" type="button">Copiar tabela</button></div>
    <div class="group" id="snets"></div>
    <p class="note" id="note"></p>
  </div>
</div>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var S={net:"192.168.0.0/24",val:"4"},active="net",mode="subnets",MAXROWS=512,csv="",hist=[],ok=false,sig="";
  var LAB={subnets:["Quantidade de sub-redes","sub-redes"],hosts:["Hosts por sub-rede","hosts"],prefix:["Novo prefixo (/n)","prefixo"]};
  var fmt=function(n){return n.toLocaleString("pt-BR")};
  var esc=function(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")};
  var ip2s=function(n){return[n>>>24,(n>>>16)&255,(n>>>8)&255,n&255].join(".")};
  var maskOf=function(p){return p===0?0:(0xFFFFFFFF<<(32-p))>>>0};
  var usable=function(p){return p>=32?1:p===31?2:Math.pow(2,32-p)-2};
  function s2ip(s){
    var a=s.split(".").map(Number);
    if(a.length!==4||a.some(function(o){return!Number.isInteger(o)||o<0||o>255}))return null;
    return a.reduce(function(x,o){return x*256+o},0);
  }
  function maskToPrefix(m){
    var inv=(~m)>>>0;if((inv&(inv+1))!==0)return null;
    var p=0;for(var i=31;i>=0;i--){if((m>>>i)&1)p++;else break}return p;
  }
  function parse(str){
    var m=str.trim().match(/^(\d+\.\d+\.\d+\.\d+)\s*(?:\/\s*(\d{1,2})|\s+(\d+\.\d+\.\d+\.\d+))?$/);
    if(!m)throw new Error("Formato inválido. Exemplo: 192.168.0.0/24");
    var ip=s2ip(m[1]);if(ip===null)throw new Error("Cada número do IP deve estar entre 0 e 255.");
    var p;
    if(m[2]!==undefined){p=+m[2];if(p>32)throw new Error("O prefixo deve estar entre 0 e 32.")}
    else if(m[3]!==undefined){
      var mk=s2ip(m[3]);if(mk===null)throw new Error("Máscara inválida.");
      p=maskToPrefix(mk);if(p===null)throw new Error("A máscara precisa ter bits 1 contínuos.");
    }else throw new Error("Informe o prefixo (/24) ou a máscara (255.255.255.0).");
    return{ip:ip,p:p};
  }
  function klass(n){var o=n>>>24;return o<128?"A":o<192?"B":o<224?"C":o<240?"D (multicast)":"E (reservada)"}
  function kind(n){
    var a=n>>>24,b=(n>>>16)&255;
    if(a===10||(a===172&&b>=16&&b<=31)||(a===192&&b===168))return"Privado";
    if(a===127)return"Loopback";if(a===169&&b===254)return"Link-local";return"Público";
  }
  function bin(m,p){
    var b=(m>>>0).toString(2).padStart(32,"0"),o="";
    for(var i=0;i<32;i++){if(i&&i%8===0)o+=".";o+=i<p?"<i>"+b[i]+"</i>":"<u>"+b[i]+"</u>"}
    return'<span class="bin">'+o+"</span>";
  }
  function rows(a){return a.map(function(r){return'<div class="row"><span>'+r[0]+"</span><b>"+r[1]+"</b></div>"}).join("")}

  function fit(){
    var v=$("netv"),box=$("net"),size=44;
    v.style.fontSize=size+"px";
    while(v.scrollWidth>box.clientWidth-24&&size>20){size-=2;v.style.fontSize=size+"px"}
  }
  function paint(){
    [["net","netv","192.168.0.0/24"],["val","valv","4"]].forEach(function(f){
      var el=$(f[1]),t=S[f[0]];
      el.textContent=t===""?f[2]:t;el.classList.toggle("ph",t==="");
      $(f[0]).classList.toggle("on",active===f[0]);
    });
    $("vlab").textContent=LAB[mode][0];
    fit();
  }

  function calc(){
    $("err").textContent="";ok=false;
    try{
      var base=parse(S.net),p=base.p,mask=maskOf(p),net=(base.ip&mask)>>>0,size0=Math.pow(2,32-p),bc0=(net+size0-1)>>>0;
      if(S.val==="")throw new Error("Digite um valor para dividir a rede.");
      var v=+S.val;if(!(v>=1))throw new Error(mode==="prefix"?"Digite o prefixo.":"Digite um número maior que zero.");
      var np;
      if(mode==="subnets"){np=p+Math.ceil(Math.log2(v));if(np>32)throw new Error("Essa rede não comporta "+fmt(v)+" sub-redes.")}
      else if(mode==="hosts"){
        var k=2;while(Math.pow(2,k)-2<v&&k<=32)k++;np=32-k;
        if(np<p)throw new Error("Não cabe: /"+p+" tem só "+fmt(usable(p))+" hosts utilizáveis.");
      }else{
        np=v;if(np>32)throw new Error("O prefixo deve estar entre 0 e 32.");
        if(np<p)throw new Error("O novo prefixo deve ser maior ou igual a /"+p+".");
      }
      var nm=maskOf(np),size=Math.pow(2,32-np),count=Math.pow(2,np-p);
      $("orig").innerHTML=rows([
        ["Rede",ip2s(net)+"/"+p],["Máscara",ip2s(mask)],["Wildcard",ip2s((~mask)>>>0)],
        ["Primeiro host",ip2s(p>=31?net:net+1)],["Último host",ip2s(p>=31?bc0:bc0-1)],
        ["Broadcast",p>=31?"—":ip2s(bc0)],["Hosts utilizáveis",fmt(usable(p))],
        ["Classe / tipo",klass(net)+" · "+kind(net)]]);
      $("sub").innerHTML=rows([
        ["Prefixo","/"+np],["Máscara",ip2s(nm)],["Wildcard",ip2s((~nm)>>>0)],["Binário",bin(nm,np)],
        ["Sub-redes",fmt(count)],["Endereços por sub-rede",fmt(size)],["Hosts por sub-rede",fmt(usable(np))]]);
      var show=Math.min(count,MAXROWS),h="";
      csv="Sub-rede;Rede;Primeiro host;Último host;Broadcast;Hosts\n";
      for(var i=0;i<show;i++){
        var n=(net+i*size)>>>0,b=(n+size-1)>>>0,f=np>=31?n:n+1,l=np>=31?b:b-1,bc=np>=31?"—":ip2s(b);
        h+='<div class="sn"><b>'+(i+1)+" · "+ip2s(n)+"/"+np+"</b><div><span>Hosts</span><em>"+ip2s(f)+" – "+ip2s(l)+
          '</em></div><div><span>Broadcast</span><em class="bc">'+bc+"</em></div><div><span>Utilizáveis</span><em>"+fmt(usable(np))+"</em></div></div>";
        csv+=[i+1,ip2s(n)+"/"+np,ip2s(f),ip2s(l),bc,usable(np)].join(";")+"\n";
      }
      $("snets").innerHTML=h;
      $("tt").textContent=fmt(count)+(count===1?" sub-rede":" sub-redes");
      var msg=[];
      if(net!==base.ip)msg.push("O IP informado pertence à rede "+ip2s(net)+"/"+p+", usada como base.");
      if(count>MAXROWS)msg.push("Mostrando as primeiras "+fmt(MAXROWS)+" de "+fmt(count)+" sub-redes.");
      $("note").textContent=msg.join(" ");
      sig=S.net.trim()+"|"+mode+"|"+S.val;ok=true;
    }catch(e){$("err").textContent=e.message}
  }
  function refresh(){paint();calc()}

  function type(ch){
    if(active==="val"){if(!/\d/.test(ch)||S.val.length>=10)return;S.val=(S.val==="0"?"":S.val)+ch}
    else{if(!/[\d.\/ ]/.test(ch)||S.net.length>=31)return;S.net+=ch}
    refresh();
  }
  function back(){S[active]=S[active].slice(0,-1);refresh()}
  function clearField(){S[active]="";refresh()}
  function equals(){
    calc();if(!ok)return;
    var key=sig;
    if(hist.length&&hist[0].key===key)return;
    hist.unshift({key:key,net:S.net.trim(),val:S.val,mode:mode,t:S.net.trim()+" → "+fmt(+S.val)+" "+LAB[mode][1]});
    if(hist.length>50)hist.pop();
    renderHist();
  }
  function setMode(m){
    mode=m;
    document.querySelectorAll(".seg button").forEach(function(x){x.setAttribute("aria-pressed",x.dataset.m===m?"true":"false")});
    S.val=m==="subnets"?"4":m==="hosts"?"50":"26";refresh();
  }
  $("pad").addEventListener("click",function(e){
    var b=e.target.closest("button[data-k]");if(!b)return;var k=b.dataset.k;
    if(k.indexOf("t:")===0){var t=k.slice(2);if(t==="255"){"255".split("").forEach(type)}else type(t)}
    else if(k==="ac")clearField();else if(k==="bs")back();
    else if(k==="sw"){active=active==="net"?"val":"net";paint()}
    else if(k==="eq")equals();
  });
  $("net").addEventListener("click",function(){active="net";paint()});
  $("val").addEventListener("click",function(){active="val";paint()});
  document.querySelectorAll(".seg button").forEach(function(b){b.addEventListener("click",function(){setMode(b.dataset.m)})});

  function renderHist(){
    var l=$("list");
    if(!hist.length){l.innerHTML='<li class="empty">Toque em = para guardar um cálculo.</li>';return}
    l.innerHTML=hist.map(function(h,i){
      return'<li data-i="'+i+'"><b>'+esc(h.net)+"</b><small>"+esc(fmt(+h.val)+" "+LAB[h.mode][1])+"</small></li>";
    }).join("");
  }
  $("list").addEventListener("click",function(e){
    var li=e.target.closest("li[data-i]");if(!li)return;
    var h=hist[+li.dataset.i];S.net=h.net;
    mode=h.mode;
    document.querySelectorAll(".seg button").forEach(function(x){x.setAttribute("aria-pressed",x.dataset.m===mode?"true":"false")});
    S.val=h.val;$("sheet").classList.remove("open");refresh();
  });
  $("hbtn").addEventListener("click",function(){$("sheet").classList.add("open")});
  $("hclose").addEventListener("click",function(){$("sheet").classList.remove("open")});
  $("hclear").addEventListener("click",function(){hist=[];renderHist()});
  $("copy").addEventListener("click",function(){
    var b=$("copy");
    function done(t){b.textContent=t;setTimeout(function(){b.textContent="Copiar tabela"},1600)}
    try{navigator.clipboard.writeText(csv).then(function(){done("Copiado")},function(){done("Não foi possível copiar")})}
    catch(e){done("Não foi possível copiar")}
  });
  document.addEventListener("keydown",function(e){
    if(e.ctrlKey||e.metaKey||e.altKey)return;
    var k=e.key;
    if(/^[0-9.\/ ]$/.test(k)){if(k===" ")e.preventDefault();type(k)}
    else if(k===","){type(".")}
    else if(k==="Backspace")back();
    else if(k==="Enter"||k==="="){e.preventDefault();equals()}
    else if(k==="Escape")clearField();
    else if(k==="ArrowUp"||k==="ArrowDown"){e.preventDefault();active=active==="net"?"val":"net";paint()}
  });
  window.addEventListener("resize",fit);
  renderHist();refresh();
})();
</script>
</body>
</html>
